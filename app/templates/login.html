<!DOCTYPE html>
<html>
<body>
  <h1>Login</h1>

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}

  <form action="/auth/login" method="post">
    <input type="text" name="username">
    <input type="text" name="password">
    <button type="submit">Login</button>
  </form>
</body>
</html>
