<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f0f8;
      --card:         #ffffff;
      --accent:       #c9aee5;
      --accent-2:     #f2a7c3;
      --text:         #4a3f55;
      --text-muted:   #9b8daa;
      --border:       #e8dff0;
      --input-bg:     #faf7fc;
      --error-bg:     #fde8ee;
      --error-text:   #c0526f;
      --error-border: #f5b8cb;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 50% at 20% 10%, #ddd0f5 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 90%, #fce4ef 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 60% 40%, #cde8f5 0%, transparent 55%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: var(--text);
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
    }

    /* Brand mark */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      animation: fadeUp 0.5s ease both;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .brand-dot:nth-child(1) { background: #c9aee5; }
    .brand-dot:nth-child(2) { background: #f2a7c3; width: 14px; height: 14px; }
    .brand-dot:nth-child(3) { background: #a7d4f2; }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2.25rem;
      box-shadow:
        0 2px 4px rgba(180,150,210,0.06),
        0 12px 40px rgba(180,150,210,0.12),
        0 40px 80px rgba(180,150,210,0.08);
      animation: fadeUp 0.55s ease 0.05s both;
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .card-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .card-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 300;
    }

    /* Step indicator */
    .steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 2rem;
    }
    .step {
      height: 4px;
      border-radius: 99px;
      background: var(--border);
    }
    .step.done  { width: 28px; background: var(--accent-2); }
    .step.active { width: 28px; background: var(--accent); }
    .step.upcoming { width: 16px; }

    /* Error */
    .error-box {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .error-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 1px;
    }

    /* Form */
    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: #c5b8d0;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem 0.75rem 2.4rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: #c5b8d0; }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(201,174,229,0.2);
    }

    /* Password strength bar */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 0.5rem;
    }
    .strength-segment {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: var(--border);
      transition: background 0.3s;
    }

    /* Button */
    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #cdb4f0, #f2a7c3);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 16px rgba(201,174,229,0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,174,229,0.5);
      filter: brightness(1.04);
    }
    .btn:active { transform: translateY(0); }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.75rem 0 1.5rem;
    }
    .divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid var(--border);
    }
    .divider span {
      font-size: 0.75rem;
      color: #c5b8d0;
    }

    .signin-link {
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .signin-link a {
      color: #a07cc5;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .signin-link a:hover { color: var(--accent); }

    /* Footer */
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #c0b0cc;
      margin-top: 1.5rem;
      animation: fadeUp 0.6s ease 0.3s both;
    }
    .footer-note a {
      color: #b89fd4;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="brand">
      <div class="brand-dot"></div>
      <div class="brand-dot"></div>
      <div class="brand-dot"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h1>Your details</h1>
        <p>Almost there — just a few more things</p>
      </div>

      <!-- Step progress -->
      <div class="steps">
        <div class="step done"></div>
        <div class="step active"></div>
        <div class="step upcoming"></div>
      </div>

      {% if error %}
      <div class="error-box">
        <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/auth/register/details?email={{email}}" method="post">

        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" id="username" name="username" placeholder="yourname" required autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Create a password" required autocomplete="new-password" oninput="updateStrength(this.value)">
          </div>
          <div class="strength-bar">
            <div class="strength-segment" id="s1"></div>
            <div class="strength-segment" id="s2"></div>
            <div class="strength-segment" id="s3"></div>
            <div class="strength-segment" id="s4"></div>
          </div>
        </div>

        <button type="submit" class="btn">Create account →</button>
      </form>

      <div class="divider">
        <hr><span>or</span><hr>
      </div>

      <p class="signin-link">
        Already have an account? <a href="/auth/login">Sign in</a>
      </p>
    </div>

    <p class="footer-note">
      By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </p>

  </div>

  <script>
    const colors = ['#f5b8cb', '#c9aee5', '#a7d4f2', '#a8e5c9'];
    function updateStrength(val) {
      let score = 0;
      if (val.length >= 8)              score++;
      if (/[A-Z]/.test(val))            score++;
      if (/[0-9]/.test(val))            score++;
      if (/[^A-Za-z0-9]/.test(val))     score++;
      for (let i = 1; i <= 4; i++) {
        const seg = document.getElementById('s' + i);
        seg.style.background = i <= score ? colors[score - 1] : 'var(--border)';
      }
    }
  </script>
</body>
</html>
